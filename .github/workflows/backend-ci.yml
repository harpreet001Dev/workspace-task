name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Create backend env
        run: |
          PORT="${{ secrets.PORT }}"
          PORT="${PORT:-5000}"
          MONGO_URI="${{ secrets.MONGO_URI }}"
          MONGO_URI="${MONGO_URI:-mongodb://mongodb:27017/workspace?directConnection=true}"
          ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}"
          ACCESS_TOKEN_SECRET="${ACCESS_TOKEN_SECRET:-ci_access_token_secret_32chars_long!!}"
          REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}"
          REFRESH_TOKEN_SECRET="${REFRESH_TOKEN_SECRET:-ci_refresh_token_secret_32chars_long!!}"

          cat <<EOF > backend/.env
          NODE_ENV=test
          PORT=${PORT}
          MONGO_URI=${MONGO_URI}
          ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Initialize MongoDB Replica Set
        run: |
          docker compose exec -T mongodb mongosh --eval "try { rs.initiate() } catch (e) { print(e) }" || true
      
      - name: Check Docker containers
        run: docker compose ps

      - name: Check Backend Health
        run: |
          echo "Waiting for Backend to become ready at http://localhost:5000/health..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy! Received HTTP 200 (attempt $i)"
              curl -s http://localhost:5000/health
              exit 0
            fi
            echo "Attempt $i: Backend returned HTTP $STATUS, waiting 2s..."
            sleep 2
          done

          echo "Backend failed to become healthy within 60s! Container logs:"
          docker compose logs api --tail=50
          docker compose logs mongodb --tail=50
          exit 1

      - name: Run tests
        working-directory: backend
        run: docker compose exec -T api npm test -- --forceExit

      - name: Stop Docker Compose
        if: always()
        run: docker compose down