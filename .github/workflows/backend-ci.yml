name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Create backend env
        run: |
          echo "NODE_ENV=test" >> backend/.env
          echo "PORT=${{ secrets.PORT || '5000' }}" >> backend/.env
          echo "MONGO_URI=${{ secrets.MONGO_URI || 'mongodb://mongodb:27017/workspace' }}" >> backend/.env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET || 'ci_access_token_secret_32chars_long!!' }}" >> backend/.env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET || 'ci_refresh_token_secret_32chars_long!!' }}" >> backend/.env
          echo "FRONTEND_URL=http://localhost:5173" >> backend/.env

      - name: Start Docker Compose
        run: docker compose up -d
      
      - name: Check Docker containers
        run: docker compose ps

      - name: Show API logs
        run: docker compose logs api --tail=100

      - name: Check Backend Health
        run: |
          PORT="${{ secrets.PORT || '5000' }}"
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 --max-time 10 http://localhost:${PORT}/health || {
            echo "Health check failed! Showing container logs:"
            docker compose logs api --tail=50
            docker compose logs mongodb --tail=50
            exit 1
          }

      - name: Run tests
        working-directory: backend
        run: docker compose exec -T api npm test -- --forceExit

      - name: Stop Docker Compose
        if: always()
        run: docker compose down